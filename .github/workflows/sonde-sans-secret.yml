# Sonde jetable — 19/09/2026. À supprimer dès qu'elle a répondu.
#
# Question : pourquoi le workflow de déploiement finit-il en
# `action_required` avec zéro job, alors que `epreuves.yml` et
# `verifier-le-deploiement.yml` passent sur le même push, à la même seconde ?
#
# Deux hypothèses ont déjà été éliminées par la mesure : l'action tierce
# (retirée, aucun changement) et l'identité du fichier (renommé, aucun
# changement). Par élimination des clés structurelles, il ne reste qu'un
# trait que les deux workflows qui passent n'ont pas : **ils ne lisent
# aucun secret.**
#
# Celle-ci n'en lit aucun. Sa jumelle `sonde-avec-secret.yml` en lit un.
# Elles sont identiques par ailleurs. Une qui passe et l'autre qui bloque,
# et la question est tranchée.
name: Sonde sans secret
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sonde-sans
  cancel-in-progress: false
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Cette sonde ne lit aucun secret, et elle a démarré."
