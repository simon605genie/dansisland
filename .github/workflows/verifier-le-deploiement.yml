# ============================================================
#  Le site est-il vraiment en ligne, et complet ?
#
#  Pourquoi ce fichier existe : Cloudflare Pages déploie `main` tout seul,
#  et jusqu'ici la seule façon de savoir si ça avait marché était d'aller
#  regarder le tableau de bord ou de lancer trois `curl` à la main. Un
#  déploiement qu'on ne vérifie que quand on y pense est un déploiement
#  qu'on découvre cassé par quelqu'un d'autre.
#
#  Ce qu'il fait : il attend que le site porte bien la version qu'on vient
#  de pousser, puis il regarde les quelques adresses dont la panne serait
#  silencieuse. Silencieuse est le mot qui compte — un `index.html` qui ne
#  démarre pas rend une page blanche sans rien dire, et une page publique
#  qui n'est pas servie ne se voit que dans un aperçu WhatsApp, des jours
#  plus tard.
#
#  Deux niveaux, et la distinction est voulue :
#
#    * ce qui fait **échouer** le job : le site ne répond pas, le build de
#      ce commit n'est pas passé, ou le jeu ne peut pas démarrer ;
#    * ce qui ne fait qu'**avertir** : rien. Les adresses publiques ont
#      **deux** réponses acceptables — leur propre page quand les Cloudflare
#      Pages Functions sont servies, le jeu quand elles ne le sont pas, le
#      catch-all prenant alors le relais. Le job n'échoue que sur la
#      troisième réponse : ni l'une ni l'autre. C'est là qu'atterrissent les
#      liens déjà partagés, et une adresse partagée qui tombe à côté est la
#      seule panne dont on ne s'aperçoit jamais soi-même. Le log dit
#      laquelle des deux on a, donc il dit aussi si les fonctions sont
#      vivantes — sans qu'un avertissement permanent finisse par ne plus
#      être lu.
# ============================================================
name: Vérifier le déploiement

on:
  push:
  workflow_dispatch:
  # Une fois par semaine : un site qui marchait peut cesser de marcher sans
  # qu'on ait rien poussé (certificat, réglage, quota).
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  verifier:
    name: Le site répond, et il est complet
    runs-on: ubuntu-latest
    steps:
      # Ce que sert chaque adresse du projet. Diagnostic pur : il n'échoue
      # jamais, il regarde. Il existe parce qu'un site qui ne se met pas à
      # jour a deux causes très différentes et qu'on ne peut pas les
      # distinguer depuis le dépôt :
      #
      #   * le build ne tourne pas → toutes les adresses sont vieilles ;
      #   * le build tourne mais le domaine ne pointe pas dessus → le
      #     `.pages.dev` est à jour et le domaine public ne l'est pas.
      #
      # Deux minutes de log ici valent une demi-heure d'hypothèses.
      # Le dépôt est cloné pour que le pas suivant puisse comparer ce qui
      # est **servi** à ce que le dépôt **contient**. Sans ça, la seule
      # fraîcheur vérifiable est une phrase écrite en dur une fois pour
      # toutes, et elle reste vraie des semaines après le dernier
      # déploiement.
      - uses: actions/checkout@v4

      - name: Ce que sert chaque adresse
        continue-on-error: true
        run: |
          set -uo pipefail
          for h in https://dansisland.app \
                   https://dansisland.pages.dev \
                   https://main.dansisland.pages.dev; do
            t=$(curl -sS --max-time 20 "$h/" 2>/dev/null | grep -o '<title>[^<]*' | head -1 || true)
            n=$(curl -sS --max-time 20 "$h/" 2>/dev/null | grep -c 'Ton petit endroit pour ralentir' || true)
            r=$(curl -sS -o /dev/null -w '%{content_type}' --max-time 20 "$h/robots.txt" 2>/dev/null || true)
            printf '%-42s titre=%-52s neuf=%s robots=%s\n' "$h" "${t:-(rien)}" "$n" "${r:-(rien)}"
          done

      - name: Vérifier https://dansisland.app
        env:
          SITE: https://dansisland.app
        run: |
          set -uo pipefail
          echos() { printf '%s\n' "$*"; }
          resume() { printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }

          # **Chercher dans une page ne passe jamais par un tuyau ici**, et
          # ce fichier l'a appris deux fois dans la même soirée.
          #
          # `grep -q` sort dès qu'il a trouvé et ferme son entrée. Ce qui
          # écrivait dedans reçoit alors un tuyau cassé — `curl: (23)` au
          # premier essai, `printf: write error: Broken pipe` au second,
          # après que le correctif eut retiré `curl` du tuyau sans retirer
          # le tuyau. Et `pipefail` rend cet échec-là plutôt que le succès
          # de `grep`. Le test répond donc **faux au moment précis où le
          # motif est là**, c'est-à-dire le seul moment qui compte.
          #
          # Les mêmes lignes ne cassaient pas sur `robots.txt` : l'écrivain
          # a le temps de finir avant que `grep` ne sorte. Il faut une page
          # entière — 368 ko — pour que la course se voie. Un défaut qui ne
          # se montre que sur le gros fichier est un défaut qu'on croit
          # corrigé.
          #
          # `contient` est en bash pur : pas de tuyau, pas de processus,
          # rien qui puisse se casser entre les deux.
          contient() { case "$2" in (*"$1"*) return 0 ;; (*) return 1 ;; esac; }

          duro=0   # ce qui fait échouer
          mou=0    # ce qui n'avertit que

          # --- 1. Le build de ce commit est-il passé ? -------------------
          # **On ne regarde jamais un code HTTP ici**, et c'est la leçon du
          # premier essai de ce fichier : `_redirects` porte un catch-all
          # `/* /index.html 200`, donc **toute** adresse répond 200, même
          # celles qui n'existent pas. Un `/robots.txt` à 200 ne prouvait
          # donc rien du tout — il servait la page du jeu.
          #
          # Le témoin est du **contenu** : la phrase de l'accueil, qui est
          # écrite en dur dans `index.html` et n'existait pas avant. Elle,
          # le catch-all ne peut pas l'inventer. Cloudflare met une minute
          # ou deux, donc on attend au lieu de conclure trop vite.
          echos "→ On attend que le déploiement soit en ligne (témoin : la phrase de l'accueil)"
          vu=0
          for i in $(seq 1 30); do
            page=$(curl -sS --max-time 20 "$SITE/" || true)
            if contient 'Ton petit endroit pour ralentir' "$page"; then
              vu=1; break
            fi
            echos "   essai $i : c'est encore l'ancienne page — on repatiente 12 s"
            sleep 12
          done
          if [ "$vu" = "1" ]; then
            echos "✅ L'accueil porte sa promesse : le build de ce changement est en ligne."
            resume "✅ **Déployé** — « Ton petit endroit pour ralentir » est servi en dur dans le HTML."
          else
            echos "❌ Six minutes plus tard, le site sert toujours l'ancienne page."
            resume "❌ **Pas déployé** — le site sert encore l'ancienne page six minutes après. Regarde les Deployments du projet Pages : le build a échoué, ou il n'a pas été déclenché."
            duro=1
          fi

          # --- 1 bis. La version servie est-elle celle du dépôt ? --------
          #
          # La phrase de l'accueil dit « un déploiement a eu lieu un jour »,
          # pas « le dernier commit est en ligne » : elle est écrite en dur
          # et ne change plus. Le 19/09, elle répondait ✅ alors que trois
          # objets fusionnés le matin même n'étaient pas servis.
          #
          # Le témoin qui ne vieillit pas : **chaque clé d'article du
          # catalogue présente dans le dépôt doit se retrouver dans la page
          # servie.** Un objet ajouté et pas encore déployé manque, et se
          # nomme. Rien à mettre à jour à la main quand la boutique
          # s'agrandit — c'est le dépôt lui-même qui fournit la liste.
          cles=$(grep -o "k:'[a-z]*'" index.html | sed "s/k:'//;s/'//" | sort -u)
          absents=""
          for k in $cles; do
            contient "'$k'" "$page" || absents="$absents $k"
          done
          if [ -z "$absents" ]; then
            n=$(printf '%s\n' $cles | wc -l | tr -d ' ')
            echos "✅ Les $n clés d'article du dépôt sont toutes dans la page servie."
            resume "✅ **À jour** — les $n clés d'article du dépôt sont servies."
          else
            echos "❌ La page servie est plus ancienne que le dépôt. Manquent :$absents"
            resume "❌ **En retard** — la page servie ne contient pas :$absents"
            resume ""
            resume "Redéploie : \`./build.sh && npx wrangler pages deploy dist --project-name dansisland --branch main\`"
            duro=1
          fi

          # --- 2. Les fichiers qui n'existaient pas avant ----------------
          # Même piège : on lit le contenu et le type, jamais le code.
          rt=$(curl -sS --max-time 20 "$SITE/robots.txt" || true)
          rtt=$(curl -sS -o /dev/null -w '%{content_type}' --max-time 20 "$SITE/robots.txt" || true)
          if contient 'User-agent: *' "$rt"; then
            echos "✅ /robots.txt est un vrai fichier ($rtt)."
            resume "✅ **robots.txt** — servi comme un vrai fichier (\`$rtt\`)."
          else
            echos "❌ /robots.txt ne rend pas son contenu (type vu : '$rtt') — c'est le catch-all qui répond."
            resume "❌ **robots.txt** — pas servi comme un fichier (type vu : \`$rtt\`) ; c'est le catch-all qui répond."
            duro=1
          fi

          # --- 3. Le module démarre-t-il ? -------------------------------
          # C'est le piège trouvé en éprouvant /carte/<slug> : un module
          # servi en `text/html` est refusé sans appel, et le jeu ne
          # démarre pas du tout — page blanche, une ligne dans la console.
          # On vérifie donc le type MIME, pas seulement le code.
          ct=$(curl -sS -o /dev/null -w '%{content_type}' --max-time 20 "$SITE/src/store.js" || true)
          case "$ct" in
            *javascript*|*ecmascript*)
              echos "✅ /src/store.js est servi en $ct : le module peut démarrer."
              resume "✅ **Module** — \`/src/store.js\` servi en \`$ct\`." ;;
            *)
              echos "❌ /src/store.js est servi en '$ct' — un module à ce type-là est refusé, le jeu ne démarre pas."
              resume "❌ **Module** — \`/src/store.js\` servi en \`$ct\` : le jeu ne démarrera pas."
              duro=1 ;;
          esac

          # --- 4. Les adresses publiques mènent quelque part -------------
          # `/island/<slug>` et `/carte/<slug>` ont **deux** réponses
          # acceptables, et c'est voulu :
          #
          #   * leur propre page, écrite par la Cloudflare Pages Function ;
          #   * le jeu, quand les fonctions ne sont pas servies — le
          #     catch-all de `_redirects` prend le relais et
          #     `routerDepuisURL()` sait ouvrir ces deux adresses, en
          #     retenant le parrainage au passage.
          #
          # Ce qui n'est **pas** acceptable est la troisième réponse : ni
          # l'une ni l'autre. C'est là qu'atterrissent les liens déjà
          # partagés, et c'est le piège du chemin absolu qui rend ça
          # bloquant — à deux segments, un module importé en relatif se
          # résout à côté et la page reste blanche, sans rien dire.
          for ad in "/island/dan" "/carte/dan"; do
            page=$(curl -sS --max-time 25 "$SITE$ad" || true)
            if contient 'sur Dan’s Island' "$page"; then
              echos "✅ $ad rend sa page publique (les fonctions sont servies)."
              resume "✅ **Lien partagé** — \`$ad\` rend sa page publique : les Pages Functions sont servies."
            elif contient 'Ton petit endroit pour ralentir' "$page"; then
              echos "✅ $ad mène au jeu (les fonctions ne sont pas servies, le catch-all a pris le relais)."
              resume "✅ **Lien partagé** — \`$ad\` mène au jeu ; les Pages Functions ne sont pas servies, le catch-all a pris le relais."
            else
              echos "❌ $ad ne mène ni à sa page ni au jeu : une adresse déjà partagée tombe à côté."
              resume "❌ **Lien partagé** — \`$ad\` ne mène ni à sa page publique ni au jeu."
              duro=1
            fi
          done

          # Le plan du site, quand les fonctions sont là. Il ne fait
          # qu'informer : sans elles, `robots.txt` ne l'annonce pas non plus,
          # donc il n'y a rien de cassé à signaler.
          plan=$(curl -sS --max-time 25 "$SITE/sitemap.xml" || true)
          if contient '<urlset' "$plan"; then
            n=$(printf '%s' "$plan" | grep -c '<loc>' || true)
            echos "✅ Le plan du site rend $n adresse(s)."
            resume "✅ **Plan du site** — \`/sitemap.xml\` rend $n adresse(s)."
          else
            echos "·  /sitemap.xml ne rend pas de XML : les fonctions ne sont pas servies."
          fi

          echos ""
          [ "$mou" = "1" ] && echos "⚠️  Des avertissements."
          if [ "$duro" = "1" ]; then
            echos "❌ Le déploiement n'est pas bon."
            exit 1
          fi
          echos "✅ Le site est en ligne et le jeu peut démarrer."
