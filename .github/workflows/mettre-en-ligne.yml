# ============================================================
#  Déployer sur Cloudflare Pages, sans dépendre de l'intégration Git.
#
#  Pourquoi ce fichier existe : le 18/09/2026, la production a cessé d'être
#  redéployée. Mesuré depuis un runner — `dansisland.app` et
#  `dansisland.pages.dev` servaient tous deux l'ancienne page, et
#  `main.dansisland.pages.dev` répondait « Deployment Not Found », donc
#  aucun déploiement n'existait pour `main`. Ce n'était ni le DNS, ni le
#  cache, ni le contenu du dépôt : **le build ne se déclenchait plus**.
#
#  Une intégration Git qui décroche est muette : rien dans le dépôt ne le
#  dit, aucun e-mail ne part, et on s'en aperçoit en regardant le site des
#  jours plus tard. Ce workflow rend le déploiement **explicite** : il est
#  ici, il se lit, il laisse un log, et il échoue bruyamment.
#
#  Il ne remplace pas forcément l'intégration Git — si elle repart, les
#  deux coexistent sans dommage (deux déploiements du même contenu). Mais
#  il ne dépend plus d'elle.
#
#  CE QU'IL FAUT LUI DONNER, et une seule fois :
#
#    Settings → Secrets and variables → Actions → New repository secret
#
#      CLOUDFLARE_API_TOKEN    un jeton avec la permission
#                              « Cloudflare Pages: Edit » sur ce compte
#      CLOUDFLARE_ACCOUNT_ID   l'identifiant de compte, visible dans l'URL
#                              du tableau de bord Cloudflare
#
#  Ils restent chez GitHub : personne ne les lit, ils ne passent pas dans
#  les logs, et ils ne sont pas dans ce dépôt. Sans eux, le job s'arrête
#  au premier pas en disant exactement ce qui manque — plutôt que d'aller
#  échouer plus loin sur une erreur d'authentification illisible.
#
#  ------------------------------------------------------------------
#  LE 19/09/2026 : CE QUI EST MESURÉ, ET CE QUI RESTE OUVERT
#
#  **Le fait qui compte, et il est établi :** `CLOUDFLARE_API_TOKEN`
#  **n'existe pas dans ce dépôt.** Une sonde jetable l'a lu dans un job
#  qui, lui, a bien tourné : la variable est arrivée vide. Donc même si ce
#  workflow démarrait, il s'arrêterait à son premier pas. **Tant que le
#  secret n'est pas ajouté, aucun déploiement ne peut partir d'ici**, quoi
#  qu'on fasse d'autre à ce fichier.
#
#  À côté de ça, un second défaut, non résolu : les treize exécutions de
#  ce workflow finissent en `action_required` en deux secondes, avec zéro
#  job créé — donc bloquées avant d'être planifiées. Quatre hypothèses ont
#  été éprouvées, trois sont **fausses**, et c'est écrit ici pour qu'on ne
#  les reprenne pas :
#
#    1. l'action tierce `cloudflare/wrangler-action@v3` → retirée, aucun
#       changement. FAUX.
#    2. l'identité du fichier (son chemin, donc son workflow id) →
#       renommé `deployer.yml` → `mettre-en-ligne.yml`, workflow id neuf,
#       run #1 bloqué pareil. FAUX.
#    3. la lecture d'un secret → une sonde qui en lit un démarre et
#       réussit. FAUX.
#    4. `toJSON(secrets)`, qui sérialisait tout le contexte des secrets →
#       c'est la seule chose qui restait pour distinguer ce fichier des
#       sondes qui démarrent. Retirée par ce commit. **Non vérifiée.**
#
#  La voie qui marche, en attendant et quoi qu'il arrive :
#
#      ./build.sh && npx wrangler pages deploy dist \
#        --project-name dansisland --branch main
#
#  ------------------------------------------------------------------
# ============================================================
name: Déployer

on:
  push:
    branches: [main]
  # Pour redéployer sans rien changer au code — après avoir réglé quelque
  # chose côté Cloudflare, par exemple.
  workflow_dispatch:

permissions:
  contents: read

# Deux pushes rapprochés ne doivent pas déployer dans le désordre : le
# dernier gagne, et on ne coupe pas un déploiement en cours.
concurrency:
  group: deployer-pages
  cancel-in-progress: false

jobs:
  deployer:
    name: Construire dist/ et le publier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # **`toJSON(secrets)` a été retiré ici**, et c'est la dernière
      # hypothèse debout sur le blocage `action_required` : il listait les
      # noms des secrets du dépôt, et c'est le seul trait qui restait pour
      # distinguer ce fichier des sondes qui, elles, démarrent. Voir le
      # journal en tête de fichier.
      #
      # Les deux noms de rechange (`CF_*`) ne sont pas une invention : c'est
      # la forme courte que beaucoup d'exemples Cloudflare emploient, et un
      # dépôt qui déployait déjà peut la porter. Le pas de publication lit
      # l'un ou l'autre avec `||`.
      - name: Les secrets sont-ils là ?
        env:
          JETON: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          COMPTE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          manque=0
          [ -z "${JETON:-}" ]  && { echo "❌ Aucun jeton : ni CLOUDFLARE_API_TOKEN ni CF_API_TOKEN";  manque=1; }
          [ -z "${COMPTE:-}" ] && { echo "❌ Aucun compte : ni CLOUDFLARE_ACCOUNT_ID ni CF_ACCOUNT_ID"; manque=1; }
          if [ "$manque" = "1" ]; then
            echo ""
            echo "Settings → Secrets and variables → Actions → New repository secret."
            echo "Le jeton demande la permission « Cloudflare Pages: Edit »."
            echo "L'identifiant de compte se lit dans l'URL du tableau de bord."
            {
              echo "❌ **Déploiement impossible** — il manque un secret."
              echo ""
              echo "À ajouter dans *Settings → Secrets and variables → Actions* :"
              echo "- \`CLOUDFLARE_API_TOKEN\` (permission « Cloudflare Pages: Edit »)"
              echo "- \`CLOUDFLARE_ACCOUNT_ID\` (visible dans l'URL du tableau de bord)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Un jeton et un compte sont présents."

      # `build.sh` est la seule définition de ce qui est public. On ne
      # recopie pas sa liste ici : deux listes qui divergent, et un fichier
      # part en ligne sans qu'on l'ait voulu — ou n'y part pas.
      #
      # Il ne copie **pas** `functions/` dans `dist/`, et c'est correct pour
      # les deux chemins de déploiement : wrangler cherche les Pages
      # Functions dans le **répertoire courant**, pas dans le dossier publié.
      # Le pas suivant tourne à la racine du dépôt, donc il les trouve.
      # Copiées dans `dist/`, elles seraient au contraire servies comme des
      # fichiers texte.
      - name: Préparer dist/
        run: |
          bash build.sh
          echo "Pages Functions présentes à la racine :"
          find functions -type f 2>/dev/null | sort || echo "  (aucune)"

      # `npx wrangler` et non `cloudflare/wrangler-action@v3`.
      #
      # L'honnêteté du 19/09/2026 : j'ai d'abord cru que l'action tierce
      # **était** la cause du blocage, je l'ai retirée pour ça, et **ça n'a
      # rien changé** — le run suivant est reparti en `action_required`
      # avec zéro job. L'hypothèse était fausse. Ce pas reste en `npx`
      # parce qu'il est plus simple ainsi, pas parce qu'il répare quoi que
      # ce soit : une dépendance de moins, et le même comportement.
      #
      # Ce que la mesure dit vraiment, et c'est tout ce qu'elle dit : sur le
      # même push, à la même seconde, `epreuves.yml` et
      # `verifier-le-deploiement.yml` passent, et celui-ci est bloqué avant
      # d'être planifié. Le blocage ne vient donc pas des Actions en
      # général. Reste à savoir s'il tient au **contenu** du fichier ou à
      # son **identité** — et c'est pour ça que ce fichier a changé de nom.
      - name: Publier sur Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy dist \
            --project-name=dansisland --branch=main

      - name: Ce qu'il faut savoir ensuite
        if: success()
        run: |
          {
            echo "✅ **Publié** sur le projet Pages \`dansisland\`, branche \`main\`."
            echo ""
            echo "Le workflow **Vérifier le déploiement** dit dans la minute si"
            echo "le site porte bien cette version."
          } >> "$GITHUB_STEP_SUMMARY"
