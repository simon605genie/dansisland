# ============================================================
#  Qu'est-ce que ce dépôt a sous la main pour déployer ?
#
#  Une question qu'on ne peut pas poser depuis un poste de travail ni
#  depuis le dépôt : les secrets d'Actions ne se lisent nulle part, pas
#  même par leur nom, sauf depuis un run.
#
#  Ce workflow répond à une seule chose : **existe-t-il déjà un
#  identifiant Cloudflare ici, sous n'importe quel nom ?** Parce que
#  « il manque CLOUDFLARE_API_TOKEN » et « il n'y a aucun jeton » ne
#  sont pas la même phrase, et la première fait créer un deuxième jeton
#  à qui en avait déjà un.
#
#  Il n'affiche que les **clés** de `toJSON(secrets)`, jamais les
#  valeurs. GitHub masque les valeurs dans les logs de toute façon ; on
#  ne s'appuie pas là-dessus.
# ============================================================
name: Diagnostic

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Ce que le dépôt a sous la main
    runs-on: ubuntu-latest
    steps:
      - name: Les secrets, par leur nom
        env:
          TOUS: ${{ toJSON(secrets) }}
        run: |
          set -uo pipefail
          noms=$(printf '%s' "${TOUS:-{\}}" | jq -r 'keys[]' | grep -v '^github_token$' || true)

          {
            echo "## Secrets d'Actions présents dans ce dépôt"
            echo ""
            if [ -z "$noms" ]; then
              echo "**Aucun** — en dehors du \`github_token\` fourni d'office."
            else
              printf '%s\n' "$noms" | sed 's/^/- `/;s/$/`/'
            fi
            echo ""
          } | tee -a "$GITHUB_STEP_SUMMARY"

          cf=$(printf '%s\n' "$noms" | grep -iE 'cloudflare|^cf_|wrangler|pages' || true)
          {
            if [ -n "$cf" ]; then
              echo "### Ce qui ressemble à un identifiant Cloudflare"
              echo ""
              printf '%s\n' "$cf" | sed 's/^/- `/;s/$/`/'
              echo ""
              echo "→ Le workflow **Déployer** peut s'en servir."
            else
              echo "### Rien qui ressemble à un identifiant Cloudflare"
              echo ""
              echo "Aucun run ne peut donc publier : l'API Cloudflare demande"
              echo "une authentification, et il n'y en a aucune ici."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
